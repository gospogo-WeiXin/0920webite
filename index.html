<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<title>GoSpoGo 學員 App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="logo.jpg" width="32" height="32" alt="GoSpoGo">
      <span class="brand-name">GoSpo<b>Go</b></span>
    </div>
    <h1 class="topbar-title" id="topbar-title">動態課表</h1>
  </header>

  <main class="stage">
    <section class="view" id="view-plan" role="tabpanel" aria-labelledby="tab-plan"></section>

    <section class="view view-chat" id="view-coach" role="tabpanel" aria-labelledby="tab-coach" hidden>
      <div class="coach-switch" role="radiogroup" aria-label="選擇教練">
        <button type="button" class="coach-opt" role="radio" data-coach="chen" aria-checked="true">
          <span class="avatar av-chen" aria-hidden="true">陳</span>
          <span class="coach-meta"><b>陳教練</b><small>嚴格・紀律派</small></span>
        </button>
        <button type="button" class="coach-opt" role="radio" data-coach="lin" aria-checked="false">
          <span class="avatar av-lin" aria-hidden="true">林</span>
          <span class="coach-meta"><b>林教練</b><small>溫暖・陪伴派</small></span>
        </button>
      </div>

      <div class="messages" id="messages" aria-live="polite" aria-label="與教練的對話"></div>

      <div class="quick" id="quick" aria-label="快速回覆"></div>

      <form class="composer" id="composer" autocomplete="off">
        <input id="msg-input" type="text" enterkeyhint="send" maxlength="200" placeholder="跟教練說點什麼…" aria-label="輸入訊息">
        <button type="submit" class="send" aria-label="送出">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="主選單">
    <button type="button" role="tab" id="tab-plan" class="tab" data-tab="plan" aria-selected="true" aria-controls="view-plan">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="m9 15 2 2 4-4"/></svg>
      <span>動態課表</span>
    </button>
    <button type="button" role="tab" id="tab-coach" class="tab" data-tab="coach" aria-selected="false" aria-controls="view-coach">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.7A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>
      <span>虛擬教練</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="dlg" class="dlg">
    <form method="dialog">
      <h3 id="dlg-title"></h3>
      <p id="dlg-msg"></p>
      <div class="dlg-actions">
        <button value="cancel" class="btn ghost">取消</button>
        <button value="ok" class="btn primary" id="dlg-ok">確定</button>
      </div>
    </form>
  </dialog>
</div>
<script src="app.js"></script>
</body>
</html>
